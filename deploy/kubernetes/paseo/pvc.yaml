# No storageClassName: the cluster default class is used. Both volumes hold state you want to keep.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-home
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
