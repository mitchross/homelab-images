apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
spec:
  replicas: 1
  # RWO volumes: a rolling update would start a second pod that cannot attach them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paseo
          # Replace with a pinned digest: ghcr.io/mitchross/paseo-dev:main@sha256:<digest>
          image: ghcr.io/mitchross/paseo-dev:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 6767
          env:
            - name: PASEO_HOSTNAMES
              value: paseo.example.com
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo
                  key: PASEO_PASSWORD
            # TLS ends at your proxy; trust its X-Forwarded-Proto so the web page auto-connects.
            - name: PASEO_TRUSTED_PROXIES
              value: loopback,uniquelocal
            - name: PASEO_RELAY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 12Gi
          # No liveness probe: a busy build must not trigger a restart that kills the agents.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: workspace
              mountPath: /workspace
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: paseo-home
        - name: workspace
          persistentVolumeClaim:
            claimName: paseo-workspace
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
