# Alternative to httproute.yaml. ingress-nginx closes idle WebSockets after 60 s unless you raise the timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paseo
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [paseo.example.com]
      secretName: paseo-tls
  rules:
    - host: paseo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paseo
                port:
                  name: http
