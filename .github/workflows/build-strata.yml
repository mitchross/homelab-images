name: Build Strata CUDA image
on:
  pull_request:
    paths: ['images/strata/**', '.github/workflows/build-strata.yml']
  push:
    branches: [main]
    paths: ['images/strata/**', '.github/workflows/build-strata.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strata-image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/mitchross/strata
  IMAGE_DIR: images/strata
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate pins
        id: meta
        run: |
          set -euo pipefail
          version="$(<"$IMAGE_DIR/VERSION")"
          source_ref="$(<"$IMAGE_DIR/SOURCE_REF")"
          # <upstream version, padded to four numbers>[.<image revision>]-<sha7>-sm86: the revision rebuilds the same
          # commit with other options. Upstream 0.1.57 is tagged 0.1.57.0, so talos Renovate's four-number regex parses it.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9a-f]{7}-sm86$ ]]
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" == *"-${source_ref:0:7}-sm86" ]]
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then publish=true; fi
          printf 'publish=%s\nsource_ref=%s\ntag=%s\n' "$publish" "$source_ref" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check immutable tag
        id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /tmp/image-manifest 2>/dev/null; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' /tmp/image-manifest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'digest=%s\nexists=true\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Make room for the CUDA devel base
        if: steps.exists.outputs.exists != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Checkout Strata at the pinned commit
        if: steps.exists.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Niko1221/Strata
          ref: ${{ steps.meta.outputs.source_ref }}
          path: strata-src
          persist-credentials: false
      - name: Check the pin, and that upstream builds for an AVX2 CPU, not the runner's
        if: steps.exists.outputs.exists != 'true'
        env:
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(git -C strata-src rev-parse HEAD)" == "$SOURCE_REF" ]]
          # Upstream's CMakeLists.txt version, padded to four numbers, must be the tag's first four numbers.
          cmake_version="$(sed -n 's/^project(strata VERSION \([0-9.]*\) .*/\1/p' strata-src/CMakeLists.txt)"
          [[ "$cmake_version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]
          padded="$cmake_version"
          if [[ "$padded" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then padded="$padded.0"; fi
          [[ "$(cut -d. -f1-4 <<< "${TAG%%-*}")" == "$padded" ]]
          # The GPU node is a Zen+ Threadripper (AVX2, no AVX-512). Since 0.2.x upstream's Dockerfile builds the engine and
          # the image encoder (tools/vision) with STRATA_PORTABLE=ON, its AVX2 release build, so nothing is patched now.
          # Fail if either goes back to -march=native (PORTABLE=OFF).
          [[ "$(grep -c -- '-DSTRATA_PORTABLE=ON' strata-src/Dockerfile)" -eq 2 ]]
          if grep -q -- '-DSTRATA_PORTABLE=OFF' strata-src/Dockerfile; then exit 1; fi
          grep -q -- '-DSTRATA_VISION_CUDA=ON -DSTRATA_PORTABLE=ON' strata-src/Dockerfile
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.meta.outputs.publish == 'true' && steps.exists.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        if: steps.exists.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: strata-src
          file: strata-src/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # source must be this repo: GHCR links the package to it. Upstream goes in url.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/Niko1221/Strata
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_ref }}
          build-args: |
            CUDA_ARCHITECTURES=86
            BUILD_VISION=1
            STRATA_COMMIT=${{ steps.meta.outputs.source_ref }}
            STRATA_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=strata
          cache-to: type=gha,scope=strata,mode=max
      - name: Report image digest
        if: steps.meta.outputs.publish == 'true' || steps.exists.outputs.exists == 'true'
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.exists.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published: `%s:%s@%s`\n' "$IMAGE" "$TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
