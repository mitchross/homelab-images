name: Build ARTEX image
on:
  pull_request:
    paths: ['images/artex/**', 'scripts/test-artex.sh', '.github/workflows/build-artex.yml']
  push:
    branches: [main]
    paths: ['images/artex/**', 'scripts/test-artex.sh', '.github/workflows/build-artex.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artex-image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/mitchross/artex
  IMAGE_DIR: images/artex
  UPSTREAM: BaaRai/ARTEX
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate pins
        id: meta
        run: |
          set -euo pipefail
          version="$(<"$IMAGE_DIR/VERSION")"
          source_ref="$(<"$IMAGE_DIR/SOURCE_REF")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          # v<VERSION> is an annotated tag: compare the commit it points at (^{}), not the tag object.
          tag_sha="$(git ls-remote "https://github.com/$UPSTREAM.git" "refs/tags/v$version^{}" | cut -f1)"
          [[ "$tag_sha" == "$source_ref" ]] || { echo "tag v$version is ${tag_sha:-missing}, SOURCE_REF is $source_ref"; exit 1; }
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then publish=true; fi
          printf 'publish=%s\nsource_ref=%s\ntag=%s\n' "$publish" "$source_ref" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check immutable tag
        id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /tmp/image-manifest 2>/dev/null; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' /tmp/image-manifest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'digest=%s\nexists=true\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout ARTEX at the pinned commit
        if: steps.exists.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.meta.outputs.source_ref }}
          path: artex-src
          persist-credentials: false
      - name: Check the checkout
        if: steps.exists.outputs.exists != 'true'
        env:
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$(git -C artex-src rev-parse HEAD)" == "$SOURCE_REF" ]]
      - name: Build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: artex-src
          file: artex-src/Dockerfile
          platforms: linux/amd64
          load: true
          tags: artex:test
          build-args: |
            ARTEX_VERSION=v${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=artex
          cache-to: type=gha,scope=artex,mode=max
      - name: Test with the deployment's identity, capabilities and flags
        if: steps.exists.outputs.exists != 'true'
        run: bash scripts/test-artex.sh artex:test "${{ steps.meta.outputs.tag }}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.meta.outputs.publish == 'true' && steps.exists.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: steps.meta.outputs.publish == 'true' && steps.exists.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: artex-src
          file: artex-src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # source must be this repo: GHCR links the package to it. Upstream goes in url.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_ref }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            ARTEX_VERSION=v${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=artex
      - name: Report image digest
        if: steps.meta.outputs.publish == 'true' || steps.exists.outputs.exists == 'true'
        env:
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.exists.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published: `%s:%s@%s`\n' "$IMAGE" "$TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
