name: Build Wyze Lake receiver image
on:
  pull_request:
    paths: ['images/wyze-lake/**', 'scripts/test-wyze-lake.sh', '.github/workflows/build-wyze-lake.yml']
  push:
    paths: ['images/wyze-lake/**', 'scripts/test-wyze-lake.sh', '.github/workflows/build-wyze-lake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wyze-lake-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/wyze-lake
          platforms: linux/amd64
          load: true
          tags: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=wyze-lake
          cache-to: type=gha,scope=wyze-lake,mode=min
      - name: Test as runtime user with fresh storage
        env:
          IMAGE: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-wyze-lake.sh "$IMAGE"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
