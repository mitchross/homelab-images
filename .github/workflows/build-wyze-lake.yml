name: Build Wyze Lake receiver image
on:
  pull_request:
    paths: ['images/wyze-lake/**', 'scripts/test-wyze-lake.sh', '.github/workflows/build-wyze-lake.yml']
  push:
    paths: ['images/wyze-lake/**', 'scripts/test-wyze-lake.sh', '.github/workflows/build-wyze-lake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wyze-lake-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/wyze-lake
          platforms: linux/amd64
          load: true
          tags: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=wyze-lake
          cache-to: type=gha,scope=wyze-lake,mode=min
      - name: Test as runtime user with fresh storage
        env:
          IMAGE: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-wyze-lake.sh "$IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mitchross/wyze-lake:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
