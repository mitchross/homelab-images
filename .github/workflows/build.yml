name: Build Paseo development image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paseo-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make room for the development toolchain
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/paseo-dev
          platforms: linux/amd64
          load: true
          tags: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=paseo-dev
          cache-to: type=gha,scope=paseo-dev,mode=min
      - name: Test as runtime user with fresh storage
        env:
          IMAGE: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-paseo.sh "$IMAGE"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push "$IMAGE"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$IMAGE" ghcr.io/mitchross/paseo-dev:main
            docker push ghcr.io/mitchross/paseo-dev:main
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
