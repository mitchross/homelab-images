name: Build Paseo development image
on:
  pull_request:
    paths: ['images/paseo-dev/**', 'scripts/**', '.github/workflows/build.yml']
  push:
    paths: ['images/paseo-dev/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
concurrency:
  group: paseo-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make room for the development toolchain
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/paseo-dev
          platforms: linux/amd64
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=paseo-dev
          cache-to: type=gha,scope=paseo-dev,mode=min
      - name: Test as runtime user with fresh storage
        env:
          IMAGE: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-paseo.sh "$IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mitchross/paseo-dev:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push "$IMAGE"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$IMAGE" ghcr.io/mitchross/paseo-dev:main
            docker push ghcr.io/mitchross/paseo-dev:main
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
