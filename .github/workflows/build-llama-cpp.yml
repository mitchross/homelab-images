name: Build llama.cpp CUDA image
on:
  pull_request:
    paths: ['images/llama-cpp/**', 'scripts/test-llama-cpp.sh', '.github/workflows/build-llama-cpp.yml']
  push:
    branches: [main]
    paths: ['images/llama-cpp/**', 'scripts/test-llama-cpp.sh', '.github/workflows/build-llama-cpp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: llama-cpp-image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/mitchross/llama-cpp
  IMAGE_DIR: images/llama-cpp
  # Inkling 2 Mini needs this fix (#32704); without it output is gibberish.
  REQUIRED_COMMIT: 690b87d88151dbd775bb6eff5581663688785928
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate pins
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(<"$IMAGE_DIR/VERSION")"
          source_ref="$(<"$IMAGE_DIR/SOURCE_REF")"
          [[ "$version" =~ ^b([0-9]+)-sm86$ ]]
          build="${BASH_REMATCH[1]}"
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          tag_sha="$(git ls-remote https://github.com/ggml-org/llama.cpp.git "refs/tags/b$build" | cut -f1)"
          [[ "$tag_sha" == "$source_ref" ]] || { echo "tag b$build is $tag_sha, SOURCE_REF is $source_ref"; exit 1; }
          status="$(gh api "repos/ggml-org/llama.cpp/compare/$REQUIRED_COMMIT...$source_ref" --jq .status)"
          [[ "$status" == ahead || "$status" == identical ]] || { echo "SOURCE_REF lacks $REQUIRED_COMMIT ($status)"; exit 1; }
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then publish=true; fi
          printf 'publish=%s\nsource_ref=%s\nbuild=%s\ntag=%s\n' "$publish" "$source_ref" "$build" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check immutable tag
        id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /tmp/image-manifest 2>/dev/null; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' /tmp/image-manifest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'digest=%s\nexists=true\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Make room for the CUDA devel base
        if: steps.exists.outputs.exists != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.IMAGE_DIR }}
          platforms: linux/amd64
          load: true
          tags: llama-cpp:test
          build-args: |
            LLAMA_COMMIT=${{ steps.meta.outputs.source_ref }}
            LLAMA_BUILD_NUMBER=${{ steps.meta.outputs.build }}
          cache-from: type=gha,scope=llama-cpp
          cache-to: type=gha,scope=llama-cpp,mode=max
      - name: Test as the runtime user with an empty home
        if: steps.exists.outputs.exists != 'true'
        run: bash scripts/test-llama-cpp.sh llama-cpp:test "${{ steps.meta.outputs.build }}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.meta.outputs.publish == 'true' && steps.exists.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: steps.meta.outputs.publish == 'true' && steps.exists.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.IMAGE_DIR }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            LLAMA_COMMIT=${{ steps.meta.outputs.source_ref }}
            LLAMA_BUILD_NUMBER=${{ steps.meta.outputs.build }}
          cache-from: type=gha,scope=llama-cpp
      - name: Report image digest
        if: steps.meta.outputs.publish == 'true' || steps.exists.outputs.exists == 'true'
        env:
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.exists.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published: `%s:%s@%s`\n' "$IMAGE" "$TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
